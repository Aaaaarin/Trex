<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trex live demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/phone.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--bg); }
  .top { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  .top h1 { font-size: 16px; font-weight: 600; flex: 1; }
  .wall { display: flex; min-height: 0; gap: 0; }
  .phones { display: flex; justify-content: center; align-items: center; gap: 22px; padding: 12px 18px; flex: none; }
  .lead { flex: 1; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--rule); background: var(--surface); }
  .lead .cap { padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 13px; font-weight: 500; color: var(--muted); }
  .lead iframe { flex: 1; width: 100%; border: 0; }
  .lead .cap { display: flex; gap: 4px; padding: 6px 8px; }
  .seg { border: 0; background: none; cursor: pointer; padding: 4px 11px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .seg.on { background: var(--mu-bg); color: var(--text); }
  body.no-lead .lead { display: none; }
  body.no-lead .phones { flex: 1; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .unit .cap { font-size: 13px; font-weight: 500; color: var(--muted); }
  .shell { width: calc(399px * var(--s, 0.8)); height: calc(836px * var(--s, 0.8)); }
  .phone { width: 399px; height: 836px; padding: 12px; border-radius: 52px; background: #191917; box-shadow: 0 0 0 1px #33332E, 0 18px 44px rgba(25, 25, 23, 0.22); transform: scale(var(--s, 0.8)); transform-origin: top left; }
  .glass { position: relative; width: 375px; height: 812px; border-radius: 40px; overflow: hidden; background: var(--bg); display: grid; grid-template-rows: 30px minmax(0, 1fr); }
  .notch { background: var(--surface); display: grid; place-items: center; }
  .notch i { width: 84px; height: 16px; border-radius: 9px; background: #191917; }
  .glass iframe { width: 375px; height: 100%; border: 0; display: block; background: var(--bg); }
  @media (max-width: 900px) { body { display: block; height: auto; } .wall { display: block; } .phones { flex-direction: column; } .lead { height: 80vh; border-left: 0; } }
</style>
</head>
<body>
<header class="top"><span id="mark"></span><h1>Trex</h1><button class="btn mini" id="lead">Hide lead</button><button class="btn mini" id="reset">Reset</button></header>
<div class="wall">
  <div class="phones" id="phones"></div>
  <section class="lead"><div class="cap" role="tablist" aria-label="Lead pane"><button class="seg on" id="show-dash" role="tab" aria-selected="true">Dashboard</button><button class="seg" id="show-agents" role="tab" aria-selected="false">Agents at work</button></div><iframe id="dash" src="/?top=1#/trucks" title="Dispatch lead"></iframe><iframe id="agents" title="Agents at work" hidden></iframe></section>
</div>
<script src="/static/phone.js"></script>
<script>
const params = new URLSearchParams(location.search);
const shop = params.get("shop") || "R-865";
const driver = params.get("driver") || "D02";
const depot = params.get("depot") || "BR-1";
const SCREENS = [
  ["Shop", `/call?shop=${encodeURIComponent(shop)}`, "microphone"],
  ["Driver", `/driver?id=${encodeURIComponent(driver)}`, ""],
  ["Dispatcher", `/gate?depot=${encodeURIComponent(depot)}`, ""],
];
document.getElementById("mark").innerHTML = Trex.MARK;
document.getElementById("phones").innerHTML = SCREENS.map(([name, src, allow]) => `<div class="unit"><span class="cap">${name}</span><div class="shell"><div class="phone"><div class="glass"><div class="notch"><i></i></div><iframe src="${src}" title="${name}" ${allow ? `allow="${allow}"` : ""}></iframe></div></div></div></div>`).join("");

function fit() {
  const room = window.innerHeight - document.querySelector(".top").offsetHeight - 24 - 28;
  const wide = window.innerWidth > 900 ? room / 836 : Math.min(1, (window.innerWidth - 24) / 399);
  document.documentElement.style.setProperty("--s", Math.max(0.45, Math.min(1, wide)).toFixed(3));
}
window.addEventListener("resize", fit);
fit();

document.getElementById("lead").addEventListener("click", (event) => {
  const hidden = document.body.classList.toggle("no-lead");
  event.currentTarget.textContent = hidden ? "Show lead" : "Hide lead";
});
if (params.get("lead") === "0") document.getElementById("lead").click();
function showPane(agents) {
  const frame = document.getElementById("agents");
  if (agents && !frame.getAttribute("src")) frame.setAttribute("src", "/agents");
  frame.hidden = !agents;
  document.getElementById("dash").hidden = agents;
  document.getElementById("show-agents").classList.toggle("on", agents);
  document.getElementById("show-dash").classList.toggle("on", !agents);
  document.getElementById("show-agents").setAttribute("aria-selected", String(agents));
  document.getElementById("show-dash").setAttribute("aria-selected", String(!agents));
}
document.getElementById("show-dash").addEventListener("click", () => showPane(false));
document.getElementById("show-agents").addEventListener("click", () => showPane(true));
if (params.get("pane") === "agents") showPane(true);
document.getElementById("reset").addEventListener("click", async () => {
  await Trex.post("/api/reset");
  location.reload();
});
</script>
</body>
</html>
