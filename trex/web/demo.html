<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trex live demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/phone.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--rule); }
  .wall { display: grid; grid-template-columns: minmax(0, 1.7fr) repeat(3, minmax(0, 1fr)); min-height: 0; }
  .pane { display: grid; grid-template-rows: auto minmax(0, 1fr); border-right: 1px solid var(--rule); min-height: 0; }
  .pane > a { padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
  iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
  @media (max-width: 1000px) { .wall { grid-template-columns: 1fr; grid-auto-rows: 80vh; overflow-y: auto; } }
</style>
</head>
<body>
<header><h1>Trex</h1><button class="btn tiny" id="reset">Reset</button></header>
<div class="wall">
  <div class="pane"><a href="/" target="_blank">Lead</a><iframe src="/#/trucks" title="Lead"></iframe></div>
  <div class="pane"><a href="/call" target="_blank">Shop</a><iframe src="/call" title="Shop" allow="microphone"></iframe></div>
  <div class="pane"><a href="/driver?id=D02" target="_blank">Driver</a><iframe src="/driver?id=D02" title="Driver"></iframe></div>
  <div class="pane"><a href="/gate" target="_blank">Dispatcher</a><iframe src="/gate" title="Dispatcher"></iframe></div>
</div>
<script src="/static/phone.js"></script>
<script>
document.getElementById("reset").addEventListener("click", async () => {
  await Trex.post("/api/reset");
  location.reload();
});
</script>
</body>
</html>
