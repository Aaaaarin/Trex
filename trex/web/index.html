<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23191917'/%3E%3Cpath d='M32 10v44M13 21l38 22M13 43l38-22' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<script>
try { if (localStorage.getItem("trex-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
</script>
<style>
:root {
  --bg: #FAFAF7; --surface: #FFFFFF; --side: #FDFDFB;
  --text: #191917; --muted: #66665F; --rule: #E5E4DE; --track: #ECEBE5; --hover: #EDECE6;
  --accent: #E8590C; --ink: #191917; --on-ink: #FAFAF7; --quiet-bar: #66665F;
  --or-bg: #FDECE3; --or-fg: #BF4708;
  --gr-bg: #E6F2EA; --gr-fg: #1B7340;
  --am-bg: #FBF1DC; --am-fg: #86600A;
  --mu-bg: #EDECE6; --mu-fg: #66665F;
  --sans: "Instrument Sans", "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #131311; --surface: #1B1B18; --side: #171715;
  --text: #F0EFE9; --muted: #A4A398; --rule: #2E2E29; --track: #2A2A25; --hover: #2A2A25;
  --ink: #F0EFE9; --on-ink: #191917; --quiet-bar: #8B8A80;
  --or-bg: #3A2114; --or-fg: #FF9E63;
  --gr-bg: #16301F; --gr-fg: #72CF99;
  --am-bg: #332A12; --am-fg: #E5BE62;
  --mu-bg: #2A2A25; --mu-fg: #B0AFA4;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 14px/1.4 var(--sans); overflow: hidden;
  display: grid; grid-template-columns: 188px minmax(0, 1fr);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
h2 { font-size: 15px; font-weight: 600; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
input, select {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 11px; min-width: 0;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.or { color: var(--accent); }

/* Shell */
.side { display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--rule); padding: 22px 14px 14px; position: relative; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-size: 16px; font-weight: 600; }
.tile { width: 26px; height: 26px; border-radius: 7px; background: #191917; display: grid; place-items: center; flex: none; }
[data-theme="dark"] .tile { box-shadow: 0 0 0 1px #3B3B35; }
.tile svg { width: 19px; height: 19px; }
.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 24px; }
.nav a, .sidebtn { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 8px; color: var(--muted); width: 100%; text-align: left; }
.nav a:hover, .sidebtn:hover { background: var(--hover); }
.nav a.on { background: var(--hover); color: var(--text); font-weight: 500; }
.count { font-size: 12px; min-width: 18px; padding: 0 5px; line-height: 18px; text-align: center; border-radius: 9px; background: var(--or-bg); color: var(--or-fg); font-weight: 500; }
.count.plain { background: none; color: var(--muted); font-weight: 400; }
.side-low { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.status { padding: 8px 10px 6px; font-size: 12px; color: var(--muted); }
.status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1.5px; }
.status .dot.work { background: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
.status .dot.bad { background: var(--or-fg); }
@keyframes breathe { 50% { opacity: 0.3; } }
.side-row { display: flex; align-items: center; gap: 2px; }
.side-row .sidebtn { flex: 1; }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--hover); }
.iconbtn svg { width: 16px; height: 16px; }

.demo { position: absolute; left: 14px; bottom: 56px; width: 286px; z-index: 30; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 32px rgba(25, 25, 23, 0.14); }
.demo[hidden] { display: none; }
.demo label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.demo .line { display: flex; gap: 6px; }
.demo .line > input, .demo .line > select { flex: 1; width: 100%; }
.demo .two { display: flex; gap: 6px; padding-top: 12px; border-top: 1px solid var(--rule); }
.demo .two .btn { flex: 1; }
.demo-note { font-size: 12px; color: var(--muted); min-height: 17px; overflow-wrap: anywhere; }

.content { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; height: 100vh; }
main { overflow-y: auto; padding: 26px 32px 24px; min-width: 0; }
.foot { padding: 8px 32px 12px; font-size: 12px; color: var(--muted); }

/* Parts */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.sub { color: var(--muted); margin-top: 3px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; white-space: nowrap; line-height: 1.4; }
.chip.or { background: var(--or-bg); color: var(--or-fg); }
.chip.gr { background: var(--gr-bg); color: var(--gr-fg); }
.chip.am { background: var(--am-bg); color: var(--am-fg); }
.chip.mu { background: var(--mu-bg); color: var(--mu-fg); }
.btn { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid var(--rule); background: var(--surface); }
.btn:hover { border-color: var(--muted); }
.btn.ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.ink:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.5; cursor: default; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.quiet { color: var(--muted); padding: 22px 0; }
.link { color: var(--muted); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.link:hover { color: var(--text); }
.ev { font-family: var(--mono); font-size: 12px; color: var(--or-fg); text-decoration: underline dotted; text-underline-offset: 3px; }
.ev:hover { text-decoration-style: solid; }
.sim { font-size: 11px; color: var(--am-fg); background: var(--am-bg); padding: 0 5px; border-radius: 4px; line-height: 16px; display: inline-block; }

.req { display: flex; gap: 8px; margin-top: 16px; }
.req input { flex: 1; padding: 9px 12px; }
.req .btn { padding: 8px 18px; }
.lastreq { margin-top: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.stats { display: flex; gap: 48px; margin-top: 18px; padding-bottom: 16px; }
.stat b { display: block; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }
.stats.ruled { border-bottom: 1px solid var(--rule); }

.report { margin-top: 16px; padding: 14px 18px; border-radius: 12px; background: var(--or-bg); }
.report-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--or-fg); }
.report-text { margin-top: 6px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.report-src { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.report details { margin-top: 8px; font-size: 13px; }
.report summary { cursor: pointer; color: var(--muted); }
.report details .report-text { font-size: 13px; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 28px; margin-top: 14px; align-items: start; }
.thead { font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--rule); padding: 0 4px 8px; }
.trow, .thead.tgrid { display: grid; grid-template-columns: 124px minmax(160px, 1fr) 66px 84px 92px 118px; gap: 14px; align-items: center; }
.trow { padding: 15px 4px; border-bottom: 1px solid var(--rule); }
.trow:hover { background: var(--hover); }
.trow .name { font-weight: 500; font-size: 15px; }
.trow .pct { font-size: 23px; letter-spacing: -0.01em; }
.trow .right { text-align: right; min-width: 0; }
.trow .right .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
.two-line span { display: block; }
.two-line span + span { font-size: 12px; color: var(--muted); }

.bar { position: relative; height: 14px; background: var(--track); border-radius: 2px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; transition: width 0.9s cubic-bezier(.2, .7, .2, 1), background-color 0.3s; }
.bar > i.ink { background: var(--ink); }
.bar > i.fill-or { background: var(--accent); }
.bar > b { position: absolute; top: -4px; bottom: -4px; width: 1.5px; background: var(--text); }

.needs h2 { margin-bottom: 10px; }
.need { padding: 13px 14px; margin-bottom: 10px; }
.need p { overflow-wrap: anywhere; }
.need .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* Truck view */
.tk-head { display: grid; grid-template-columns: 200px auto minmax(0, 1fr); gap: 24px; align-items: center; }
.tk-pct { font-size: 46px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.tk-bar .bar { height: 18px; max-width: 620px; }
.tk-bar p { margin-top: 8px; color: var(--muted); font-size: 13px; }
.crumbs { display: flex; gap: 14px; font-size: 13px; margin-bottom: 12px; }
.decided { margin-top: 12px; display: flex; gap: 10px; align-items: baseline; }
.sec-title { margin-top: 20px; margin-bottom: 8px; }
.opts { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.opt { padding: 15px 17px 10px; display: flex; flex-direction: column; }
.opt.rec { border: 1.5px solid var(--accent); }
.opt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 24px; }
.opt-top b { font-weight: 600; font-size: 15px; }
.opt-cost { font-size: 29px; font-weight: 500; letter-spacing: -0.01em; margin-top: 6px; line-height: 1.2; }
.opt.rec .opt-cost { color: var(--accent); }
.opt-note { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 19px; }
.opt dl { margin: 10px 0 0; }
.opt dl div { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
.opt dt { color: var(--muted); }
.opt dd { margin: 0; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.stop { display: grid; grid-template-columns: 24px 170px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.stop:first-of-type { border-top: 1px solid var(--rule); }
.stop-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.stop-line + .stop-line { margin-top: 5px; }
.stop-line small { display: block; font-size: 12px; color: var(--muted); }
.stop-status { margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.chips { display: inline-flex; gap: 5px; }

.evlist { display: flex; flex-direction: column; }
.evitem { display: block; width: 100%; text-align: left; padding: 8px 0; border-bottom: 1px solid var(--rule); }
button.evitem:hover .evsum { text-decoration: underline; text-underline-offset: 3px; }
.evitem .mono { display: block; color: var(--muted); }
.evitem .mono.st { color: var(--am-fg); }
.evsum { overflow-wrap: anywhere; font-size: 13px; }

/* Sell to fill */
.sell { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; margin-top: 18px; align-items: start; }
.gauge { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 26px; align-items: center; padding: 22px 28px 20px; }
.gauge .gnum { font-size: 92px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; color: var(--accent); transition: color 0.4s; font-variant-numeric: tabular-nums; transform-origin: left center; }
.gauge.over .gnum { color: var(--text); }
.gauge.crossed .gnum { animation: pop 0.8s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { 40% { transform: scale(1.07); } }
.gbar { position: relative; height: 22px; background: var(--track); border-radius: 2px; margin-top: 10px; }
.gbar i { position: absolute; top: 0; bottom: 0; transition: left 0.9s cubic-bezier(.2, .7, .2, 1), width 0.9s cubic-bezier(.2, .7, .2, 1); }
.gbar .g0 { left: 0; background: var(--quiet-bar); border-radius: 2px 0 0 2px; }
.gbar .g1 { background: var(--accent); }
.gbar b { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--text); }
.glabels { position: relative; height: 22px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.glabels span { position: absolute; white-space: nowrap; top: 0; }
.glabels .lt { transform: translateX(-100%); padding-right: 4px; }
.glabels .rt { padding-left: 4px; }
.glabels .hit { color: var(--text); font-weight: 500; }
.otable { width: 100%; border-collapse: collapse; }
.otable th { font-weight: 400; font-size: 13px; color: var(--muted); text-align: left; padding: 0 12px 7px 0; border-bottom: 1px solid var(--rule); }
.otable td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.otable td.why { color: var(--muted); font-size: 13px; }
.otable .r { text-align: right; padding-right: 0; white-space: nowrap; }
.otable td:first-child { white-space: nowrap; font-weight: 500; }
.otable a:hover { text-decoration: underline; text-underline-offset: 3px; }
.added { color: var(--gr-fg); }

.sell > aside { position: sticky; top: 0; }
.phone { border-radius: 22px; padding: 14px 12px 12px; }
.phone-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 5px 10px; border-bottom: 1px solid var(--rule); }
.phone-top b { font-weight: 600; }
.chat { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; max-height: 520px; overflow-y: auto; }
.bub { max-width: 86%; padding: 8px 11px; border-radius: 12px; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.38; white-space: pre-wrap; }
.bub.out { align-self: flex-start; background: var(--or-bg); }
.bub.in { align-self: flex-end; background: var(--mu-bg); }
.bub.add { align-self: stretch; max-width: none; background: var(--gr-bg); color: var(--gr-fg); }
.bub-meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 11px; color: var(--muted); white-space: normal; }
.bub.add small { display: block; font-size: 12.5px; }

/* Retailers */
.search { display: flex; gap: 8px; margin-top: 14px; max-width: 360px; }
.search input { flex: 1; }
.hints { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.hints a { border: 1px solid var(--rule); border-radius: 6px; padding: 1px 7px; color: var(--text); }
.hints a:hover { border-color: var(--muted); }
.ret-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; margin-top: 20px; align-items: start; }
.brow { display: grid; grid-template-columns: 170px minmax(150px, 1fr) minmax(190px, 300px) 76px; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.brow.h { font-size: 13px; color: var(--muted); padding: 0 0 7px; }
.range { position: relative; height: 12px; }
.range::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); }
.range i { position: absolute; top: 3px; bottom: 3px; width: 1px; background: var(--rule); }
.range b { position: absolute; top: 1px; bottom: 1px; min-width: 7px; border-radius: 5px; background: var(--ink); }
.range b.warn { background: var(--accent); }
.range b.faint { background: var(--quiet-bar); opacity: 0.65; }
.axis { display: grid; grid-template-columns: 170px minmax(150px, 1fr) minmax(190px, 300px) 76px; gap: 16px; font-size: 12px; color: var(--muted); padding-top: 6px; }
.axis div { display: flex; justify-content: space-between; }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { text-align: right; overflow-wrap: anywhere; }
.lastmsg { padding: 13px 15px; border-radius: 12px; background: var(--or-bg); margin-bottom: 16px; overflow-wrap: anywhere; }
.lastmsg small { display: flex; justify-content: space-between; font-size: 12px; color: var(--or-fg); margin-bottom: 4px; }

/* Batches */
.batch-head { display: flex; justify-content: space-between; align-items: flex-start; }
.loud { font-size: 38px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; color: var(--accent); text-align: right; }
.loud + p { font-size: 13px; color: var(--muted); text-align: right; }
.brows { margin-top: 16px; }
.bt { display: grid; grid-template-columns: 240px minmax(0, 1fr) 110px; gap: 20px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.bt.h { font-size: 13px; color: var(--muted); padding: 0 0 7px; }
.bt .dbars { display: flex; flex-direction: column; gap: 4px; }
.dbar { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.dbar i { display: block; height: 10px; border-radius: 1px; background: var(--ink); min-width: 2px; flex: none; }
.dbar.dneed i { background: var(--quiet-bar); }
.dbar.dneed.late i { background: var(--accent); }
.dbar.dneed.late { color: var(--or-fg); }
.legend { display: flex; gap: 22px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 1px; margin-right: 6px; }

/* Misses */
.chart-card { padding: 16px 18px 12px; margin-top: 16px; }
.chart-top { display: flex; justify-content: space-between; align-items: flex-start; }
.chart { position: relative; height: 130px; margin-top: 8px; display: grid; gap: 0; align-items: end; border-bottom: 1px solid var(--rule); }
.chart .col { height: 100%; display: flex; align-items: flex-end; padding: 0 3px; position: relative; }
.chart .col i { display: block; width: 100%; background: var(--ink); min-height: 0; }
.chart .run { position: absolute; top: 0; bottom: 0; background: var(--or-bg); pointer-events: none; }
.chart .run span { position: absolute; left: 10px; top: 42%; color: var(--or-fg); font-size: 13px; white-space: nowrap; }
.xlabels { position: relative; height: 18px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.xlabels span { position: absolute; white-space: nowrap; }
.up { padding: 14px 18px; margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; }
.up-title { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.upbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
.upbar .tr { height: 10px; }
.upbar i { display: block; height: 100%; min-width: 2px; border-radius: 1px; }
.upbar span:last-child { text-align: right; }
.mtable { margin-top: 18px; }

/* Timeline */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; z-index: 20; background: var(--surface); border-left: 1px solid var(--rule); display: flex; flex-direction: column; transform: translateX(102%); transition: transform 0.2s ease; visibility: hidden; }
.drawer.open { transform: none; visibility: visible; }
.drawer-head { padding: 18px 20px 10px; border-bottom: 1px solid var(--rule); }
.drawer-head .top { display: flex; justify-content: space-between; align-items: center; }
.safety { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.tl { flex: 1; overflow-y: auto; padding: 4px 20px 20px; }
.tl-item { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.tl-item time { color: var(--muted); font-size: 12px; }
.tl-item.dim .tl-t { color: var(--muted); }
.tl-d { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; white-space: pre-wrap; }
.tl-ev { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 2px; }
.tl-item.moment { margin: 8px -10px; padding: 10px; border: 0; border-radius: 10px; background: var(--or-bg); }
.tl-item.moment .tl-t { font-weight: 600; color: var(--or-fg); font-size: 14px; }
.tl-item.moment .tl-d { color: var(--text); }
.tl-item.warn .tl-t { color: var(--am-fg); }

/* Evidence panel */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(25, 25, 23, 0.28); display: flex; justify-content: flex-end; }
.scrim[hidden] { display: none; }
.evpanel { width: 480px; max-width: 100vw; height: 100%; background: var(--surface); border-left: 1px solid var(--rule); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.evpanel .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.evpanel .chips { flex-wrap: wrap; }
.evpanel h2 { font-size: 17px; overflow-wrap: anywhere; }
.evpanel pre { margin: 0; flex: 1; min-height: 0; overflow: auto; font: 12px/1.5 var(--mono); padding: 12px; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }

.toasts { position: fixed; right: 20px; bottom: 44px; width: 340px; z-index: 35; display: flex; flex-direction: column; gap: 8px; }
.toast { display: block; width: 100%; text-align: left; padding: 11px 14px; border-radius: 10px; background: var(--or-bg); color: var(--text); border: 1px solid var(--accent); font-size: 13px; animation: rise 0.2s ease; overflow-wrap: anywhere; }
.toast b { display: block; color: var(--or-fg); font-weight: 600; font-size: 14px; }
.toast.plain { background: var(--surface); border-color: var(--rule); }
.toast.plain b { color: var(--text); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.chip + .chip { margin-left: 4px; }
.drawer.open ~ .toasts { right: 420px; }

@media (max-width: 1100px) {
  .board, .split, .sell, .ret-grid, .up { grid-template-columns: minmax(0, 1fr); }
  .gauge { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

</div>

<script>
"use strict";

/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (v) => String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, (c) => ESC[c]);
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const clamp01 = (v) => Math.min(1, Math.max(0, num(v)));
const w = (v) => (clamp01(v) * 100).toFixed(2);
const pct = (v) => Math.round(num(v) * 100) + "%";
/* A load under target never reads as the target: 79.7% shows 79%, not 80%. */
const fillPct = (v) => {
  const target = targetFill();
  const r = Math.round(num(v) * 100);
  return (num(v) < target && r >= target * 100 ? Math.floor(num(v) * 100) : r) + "%";
};
const group = (n, d) => num(n).toLocaleString("en-IN", d === undefined ? { maximumFractionDigits: 0 } : { maximumFractionDigits: d });
const inr = (n) => (num(n) < 0 ? "-" : "") + "₹" + group(Math.abs(num(n)));
const inrShort = (n) => {
  const a = Math.abs(num(n));
  if (a < 100000) return inr(n);
  return (num(n) < 0 ? "-" : "") + "₹" + (a / 100000).toFixed(2).replace(/\.?0+$/, "") + " lakh";
};
const clock = (ts) => {
  const d = new Date(num(ts) * 1000);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
};
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const LONG_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const parseDate = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; };
const shortDate = (s) => { const d = parseDate(s); return d ? d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] : esc(s); };
const dayDate = (s) => { const d = parseDate(s); return d ? DAYS[d.getUTCDay()] + " " + shortDate(s) : esc(s); };
const cap = (v) => { const t = String(v === null || v === undefined ? "" : v); return t.charAt(0).toUpperCase() + t.slice(1); };
const chip = (text, tone) => `<span class="chip ${tone || "mu"}">${esc(text)}</span>`;
const plural = (n, one, many) => `${group(n)} ${n === 1 ? one : (many || one + "s")}`;
const TYPES = { kirana: "Kirana", horeca: "HoReCa", modern: "Store", outlet: "Outlet", wholesale: "Wholesale" };
const typeName = (t) => TYPES[t] || (t ? String(t).charAt(0).toUpperCase() + String(t).slice(1) : "");
const retailerLabel = (id, type) => (type ? typeName(type) + " " : "") + id;
const routes = (list) => {
  const r = list || [];
  const shown = r.slice(0, 2).join(", ");
  return (r.length === 1 ? "Route " : "Routes ") + shown + (r.length > 2 ? ` +${r.length - 2}` : "");
};

const EV_RE = /([A-Za-z0-9_.\-]+:E\d+)/g;
const evShort = (id) => String(id).slice(String(id).lastIndexOf(":") + 1);
const evBtn = (id) => `<button class="ev" data-ev="${esc(id)}" title="Open evidence">${esc(evShort(id))}</button>`;
const isEv = (s) => typeof s === "string" && /:E\d+/.test(s);
/* Escapes every part, and turns evidence ids into buttons. */
const linkEv = (text) => String(text === null || text === undefined ? "" : text).split(EV_RE).map((part, i) => (i % 2 ? evBtn(part) : esc(part))).join("");
function findEv(value, out) {
  out = out || [];
  if (typeof value === "string") { const m = value.match(EV_RE); if (m) m.forEach((x) => { if (!out.includes(x)) out.push(x); }); }
  else if (Array.isArray(value)) value.forEach((v) => findEv(v, out));
  else if (value && typeof value === "object") Object.values(value).forEach((v) => findEv(v, out));
  return out;
}

/* Patches the DOM in place, so focus, typed text, scroll and running transitions survive a poll. */
const keyOf = (n) => (n.nodeType === 1 ? n.getAttribute("data-key") : null);
function syncAttrs(a, b) {
  for (const { name } of Array.from(a.attributes)) {
    if (!b.hasAttribute(name) && !(name === "open" && a.tagName === "DETAILS")) a.removeAttribute(name);
  }
  for (const { name, value } of Array.from(b.attributes)) {
    if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  }
}
function syncNode(a, b) {
  if (a.nodeType === 1) { syncAttrs(a, b); syncChildren(a, b); }
  else if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
}
function syncChildren(parent, next) {
  const keyed = new Map();
  for (const c of Array.from(parent.childNodes)) { const k = keyOf(c); if (k) keyed.set(k, c); }
  let cur = parent.firstChild;
  for (const n of Array.from(next.childNodes)) {
    const k = keyOf(n);
    let match = null;
    if (k && keyed.has(k)) match = keyed.get(k);
    else if (cur && cur.nodeType === n.nodeType && cur.nodeName === n.nodeName && keyOf(cur) === k) match = cur;
    if (match) {
      if (k) keyed.delete(k);
      if (match === cur) cur = cur.nextSibling; else parent.insertBefore(match, cur);
      syncNode(match, n);
    } else parent.insertBefore(n, cur);
  }
  while (cur) { const x = cur.nextSibling; parent.removeChild(cur); cur = x; }
}
function morph(el, html) {
  const t = document.createElement("template");
  t.innerHTML = html;
  syncChildren(el, t.content);
}
const lastHtml = new Map();
function patch(el, html) {
  if (lastHtml.get(el) === html) return;
  lastHtml.set(el, html);
  morph(el, html);
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  if (!r.ok) throw new Error((j && j.detail) || `Server replied ${r.status}`);
  return j;
}

/* ---------- App state ---------- */
let S = null;             // the latest /api/state. The page holds no truth of its own.
let online = true;
let view = { name: "trucks" };
let runId = null;
let autoShown = null;     // the run for which sell to fill has already opened by itself
let seenSeq = null;
let requestBusy = false;
const busyDecisions = new Set();
const evCache = new Map();
let openEvidence = null;
let retailer = { id: "", data: null, error: null, loading: false };
const gauge = { start: null, shown: null, from: 0, to: 0, t0: 0, raf: 0, crossed: false };

const focusTruck = () => (S && S.board.trucks.find((t) => t.truck === S.focus)) || null;
const isSelling = () => {
  if (!S || !S.run || !S.offers || !S.offers.length) return false;
  const t = focusTruck();
  return !!t && !t.decision;
};
const pendingDecisions = () => ((S && S.decisions) || []).filter((d) => d.answer === null || d.answer === undefined);
const targetFill = () => (S ? num(S.board.target) : 0.8);
const productName = (id) => {
  if (!S) return id;
  if (S.butter && S.butter.product === id) return S.butter.label;
  const pools = [S.offers, S.batches, S.sheet];
  for (const pool of pools) for (const row of pool || []) if (row.product === id && row.product_name) return row.product_name;
  return id;
};

/* ---------- Shared pieces ---------- */
function loadBar(fill, target) {
  const over = num(fill) >= target;
  return `<div class="bar"><i class="${over ? "ink" : "fill-or"}" style="width:${w(fill)}%"></i><b style="left:${w(target)}%"></b></div>`;
}
const OPTION_NAMES = { go: "Go", sell_to_fill: "Sold to fill", merge: "Merge", hold: "Hold" };
const optionName = (o) => OPTION_NAMES[o] || String(o || "").replace(/_/g, " ");
function statusChip(t) {
  if (t.decision) {
    const o = t.decision.option;
    return chip(optionName(o), o === "go" || o === "sell_to_fill" ? "gr" : "am");
  }
  if (S.run && t.truck === S.focus && S.offers && S.offers.length) return chip("Selling to fill", "or");
  if (S.run) return chip("Undecided", "mu");
  return "";
}
function needsCards() {
  const list = pendingDecisions();
  return list.map((d) => `
    <div class="card need" data-key="need-${esc(d.id)}">
      <p>${linkEv(d.question)}</p>
      <div class="acts">${(d.options || []).map((o, i) => `<button class="btn ${i === 0 ? "ink" : ""}" data-act="answer" data-id="${esc(d.id)}" data-answer="${esc(o)}" ${busyDecisions.has(d.id) ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
    </div>`).join("");
}
function reportBlock(r) {
  const claims = (r.claims || []).map((c) => `<span>${esc(group(c.value, 2))} ${(c.evidence_ids || []).map(evBtn).join(" ")}</span>`).join("");
  return `<div class="report-text">${linkEv(r.text)}</div>${claims ? `<div class="report-src">${claims}</div>` : ""}`;
}
function reports() {
  const list = (S && S.reports) || [];
  if (!list.length) return "";
  const latest = list[list.length - 1];
  const earlier = list.slice(0, -1).reverse();
  return `<section class="report" data-key="report">
    <div class="report-top"><span>Report from Trex, ${esc(clock(latest.ts))}</span>${latest.used_standin ? chip("Uses stand-ins", "am") : ""}</div>
    ${reportBlock(latest)}
    ${earlier.length ? `<details><summary>${plural(earlier.length, "earlier report")}</summary>${earlier.map((r) => `<div data-key="rep-${esc(r.seq)}" style="margin-top:8px"><span class="muted">${esc(clock(r.ts))}</span>${reportBlock(r)}</div>`).join("")}</details>` : ""}
  </section>`;
}

/* ---------- Trucks board ---------- */
function viewTrucks() {
  const b = S.board;
  const trucks = b.trucks;
  const atTarget = trucks.filter((t) => t.at_target).length;
  const atRisk = trucks.reduce((sum, t) => sum + num(t.unserved_value_inr), 0);
  const stats = [
    [`${atTarget} of ${trucks.length}`, `at ${pct(b.target)} or more`],
    [inrShort(atRisk), "sales at risk"],
  ];
  if (S.batches && S.batches.length) stats.push([inrShort(S.batches.reduce((s, x) => s + num(x.value_inr), 0)), "stock near expiry"]);
  if (S.run) stats.push([String((S.offers || []).filter((o) => o.state === "waiting").length), "replies awaited"]);

  const rows = trucks.map((t) => {
    const over = num(t.fill) >= b.target;
    const href = isSelling() && t.truck === S.focus ? "#/sell" : `#/truck/${encodeURIComponent(t.truck)}`;
    return `<a class="trow" data-key="t-${esc(t.truck)}" href="${href}">
      <div class="two-line"><span class="name">${esc(t.truck)}</span><span>${esc(routes(t.routes))}</span></div>
      ${loadBar(t.fill, b.target)}
      <div class="pct num ${over ? "" : "or"}">${esc(fillPct(t.fill))}</div>
      <div class="two-line num"><span>${esc(group(t.kg))} kg</span><span>${esc(plural(t.stops, "stop"))}</span></div>
      <div class="two-line num">${num(t.unserved_value_inr) > 0 ? `<span>${esc(inr(t.unserved_value_inr))}</span><span>at risk</span>` : ""}</div>
      <div class="right">${statusChip(t)}</div>
    </a>`;
  }).join("");

  const needs = needsCards();
  return `<div data-key="v-trucks">
    <div class="head"><div>
      <h1>Tomorrow's trucks</h1>
      <p class="sub">${esc(dayDate(b.plan_date))} · Distributor ${esc(b.distributor)} · Records to ${esc(shortDate(b.records_to))}</p>
    </div></div>
    <form class="req" id="req-form">
      <input id="req-input" name="text" autocomplete="off" placeholder="What should Trex do for tomorrow's trucks?" aria-label="Request to Trex">
      <button class="btn ink" ${requestBusy ? "disabled" : ""}>Send</button>
    </form>
    ${S.run ? `<p class="lastreq">Last request: ${esc(S.run.request)}</p>` : ""}
    ${reports()}
    <div class="stats ruled">${stats.map((s) => `<div class="stat num"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>
    <div class="board">
      <section>
        <div class="thead tgrid"><span>Truck</span><span>Load. The line marks ${esc(pct(b.target))}</span></div>
        ${rows}
      </section>
      <aside class="needs">
        <h2>Needs you</h2>
        ${needs || `<p class="muted">Nothing waiting</p>`}
      </aside>
    </div>
  </div>`;
}

/* ---------- Truck view ---------- */
function optionCard(o, recommended, decidedOption) {
  const isRec = o.name === recommended;
  const rows = [
    ["Load", fillPct(o.load)],
    ["Truck cost", inr(o.truck_cost_inr)],
    ["Margin lost", inr(o.margin_lost_inr)],
    ["Expiry risk", inr(o.expiry_risk_inr)],
    ["Discounts", inr(o.discounts_inr)],
    ["Extra margin", inr(-num(o.extra_margin_inr))],
  ];
  const tag = decidedOption === o.name ? chip("Chosen", "gr") : isRec ? chip("Recommended", "or") : "";
  return `<div class="card opt ${isRec ? "rec" : ""}" data-key="opt-${esc(o.name)}">
    <div class="opt-top"><b>${esc(o.label)}</b>${tag}</div>
    <div class="opt-cost num">${esc(inr(o.net_cost_inr))}</div>
    <div class="opt-note">${esc(o.note)}</div>
    <dl>${rows.map((r) => `<div><dt>${esc(r[0])}</dt><dd class="num">${esc(r[1])}</dd></div>`).join("")}</dl>
  </div>`;
}
function stopsBlock(sheet) {
  const byStop = new Map();
  for (const row of sheet) {
    if (!byStop.has(row.retailer)) byStop.set(row.retailer, []);
    byStop.get(row.retailer).push(row);
  }
  let i = 0;
  const out = [];
  byStop.forEach((lines, id) => {
    i += 1;
    const drop = (S.drops || {})[id];
    const type = lines[0].retailer_type;
    const body = lines.map((l) => {
      const partial = num(l.pieces) < num(l.ordered);
      const batches = (l.batches || []).map((b) => `${b.batch}, ${group(b.pieces)} pcs, ${group(b.days_left)}d left`).join(" · ");
      const chips = [partial ? chip("Partial", "am") : "", l.source === "offer" ? chip("Added", "or") : ""].join("");
      return `<div class="stop-line"><div>${esc(l.product_name)}: ${partial ? `${esc(group(l.pieces))} of ${esc(group(l.ordered))}` : esc(group(l.pieces))}
        ${batches ? `<small>${esc(batches)}</small>` : ""}${num(l.no_batch_pieces) > 0 ? `<small>${esc(group(l.no_batch_pieces))} pcs without a batch</small>` : ""}</div>
        <span class="chips">${chips}</span></div>`;
    }).join("");
    const dropLine = drop ? `<div class="stop-status">${chip(drop.status === "delivered" ? "Delivered" : drop.status === "failed" ? "Failed" : drop.status, drop.status === "delivered" ? "gr" : "or")}${drop.photo ? `<span class="muted">Photo</span>` : ""}${isEv(drop.evidence) ? evBtn(drop.evidence) : ""}</div>` : "";
    out.push(`<div class="stop" data-key="stop-${esc(id)}">
      <span class="muted num">${i}</span>
      <div><a class="link" style="color:inherit;font-weight:500" href="#/retailers/${encodeURIComponent(id)}">${esc(retailerLabel(id, type))}</a>${dropLine}</div>
      <div>${body}</div>
    </div>`);
  });
  return out.join("");
}
function evidenceList(t, isFocus) {
  const ids = [];
  if (isFocus && S.run) {
    if (S.options) findEv(S.options.evidence_id, ids);
    (S.sheet || []).forEach((r) => findEv(r.evidence, ids));
    (S.offers || []).forEach((o) => findEv(o.evidence_id, ids));
    Object.values(S.drops || {}).forEach((d) => findEv(d.evidence, ids));
  }
  const item = (id) => {
    requestEvidence(id);
    const e = evCache.get(id);
    const standin = e && Number(e.standin) === 1;
    return `<button class="evitem" data-ev="${esc(id)}" data-key="ev-${esc(id)}">
      <span class="mono ${standin ? "st" : ""}">${esc(evShort(id))}${e ? ` · ${esc(standin ? "stand-in" : e.kind)}` : ""}</span>
      <span class="evsum">${e ? esc(e.summary) : ""}</span>
    </button>`;
  };
  const shown = ids.slice(0, 7).map(item).join("");
  const rest = ids.slice(7);
  const capacity = `<div class="evitem" data-key="ev-capacity"><span class="mono st">stand-in</span><span class="evsum">${esc(group(t.capacity_kg))} kg capacity. ${esc((S.standins || {}).vehicle_capacity_kg || "")}</span></div>`;

function syncGauge() {
  const t = focusTruck();
  if (!t) return;
  const to = num(t.fill);
  const start = gaugeStart(t);
  if (gauge.shown === null) gauge.shown = start;
  if (view.name !== "sell" && view.name !== "offers") return;
  if (gauge.to === to && (gauge.raf || gauge.shown === to)) return;
  gauge.from = gauge.shown;
  gauge.to = to;
  gauge.t0 = performance.now();
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    gauge.shown = to;
    gauge.crossed = gauge.from < targetFill() && to >= targetFill();
    return;
  }
  if (!gauge.raf) gauge.raf = requestAnimationFrame(tickGauge);
}
function tickGauge(now) {
  const p = Math.min(1, (now - gauge.t0) / 1400);
  const eased = 1 - Math.pow(1 - p, 3);
  const before = gauge.shown;
  gauge.shown = gauge.from + (gauge.to - gauge.from) * eased;
  const target = targetFill();
  if (before < target && gauge.shown >= target) gauge.crossed = true;
  const n = $("#gauge-num");
  if (n) n.textContent = fillPct(gauge.shown);
  const card = $("#gauge-card");
  if (card) {
    card.classList.toggle("over", gauge.shown >= target);
    card.classList.toggle("crossed", gauge.crossed);
  }
  if (p < 1) gauge.raf = requestAnimationFrame(tickGauge);
  else { gauge.raf = 0; gauge.shown = gauge.to; render(); }
}

/* ---------- Misses ---------- */
function longestZeroRun(days) {
  let best = { start: -1, len: 0 }, i = 0;
  while (i < days.length) {
    if (num(days[i].billed_inr) === 0) {
      let j = i;
      while (j < days.length && num(days[j].billed_inr) === 0) j += 1;
      if (j - i > best.len) best = { start: i, len: j - i };
      i = j;
    } else i += 1;
  }
  return best;
}
function butterChart() {
  const b = S.butter || { days: [] };
  const days = b.days || [];
  if (!days.length) return "";
  const max = Math.max(1, ...days.map((d) => num(d.billed_inr)));
  const run = longestZeroRun(days);
  const n = days.length;
  let peak = 0;
  days.forEach((d, i) => { if (num(d.billed_inr) > num(days[peak].billed_inr)) peak = i; });
  const marks = [0];
  if (run.len) marks.push(run.start, run.start + run.len);
  marks.push(peak, n - 1);
  const labels = [];
  Array.from(new Set(marks)).sort((x, y) => x - y).forEach((i) => {
    if (i >= n) return;
    const prev = labels[labels.length - 1];
    if (prev !== undefined && i - prev < 3) return;
    labels.push(i);
  });
  if (!labels.includes(n - 1)) { if (n - 1 - labels[labels.length - 1] < 3) labels.pop(); labels.push(n - 1); }
  const first = parseDate(days[0].date);
  return `<div class="card chart-card">
    <div class="chart-top">
      <div><h2>${esc(b.label)}, billed per selling day</h2><p class="muted small">Distributor ${esc(S.board.distributor)}${first ? `, ${esc(LONG_MONTHS[first.getUTCMonth()])} ${first.getUTCFullYear()}` : ""}</p></div>

    </div>
    <div class="chart" style="grid-template-columns:repeat(${n},minmax(0,1fr))">
      ${run.len ? `<div class="run" style="left:${(run.start / n * 100).toFixed(2)}%;width:${(run.len / n * 100).toFixed(2)}%"><span>No bills for ${run.len} selling days</span></div>` : ""}
      ${days.map((d) => `<div class="col" title="${esc(shortDate(d.date))}: ${esc(inr(d.billed_inr))}"><i style="height:${(num(d.billed_inr) / max * 100).toFixed(2)}%"></i></div>`).join("")}
    </div>
    <div class="xlabels">${labels.map((i) => `<span style="left:${(i / n * 100).toFixed(2)}%">${esc(shortDate(days[i].date))}</span>`).join("")}</div>
  </div>`;
}

    <div>
      <div class="up-title"><h2>Above the distributor</h2>${chip("Stand-in", "am")}</div>
      ${rows.map((r) => `<div class="upbar"><span class="muted">${esc(r[0])}</span><div class="tr"><i style="width:${(num(r[1]) / max * 100).toFixed(2)}%;background:${r[2]}"></i></div><span class="num">${esc(group(r[1], 1))} days</span></div>`).join("")}
    </div>
    <div>
      <div class="kv"><span>Stopped at</span><span>${esc(cap(u.stopped_at))}</span></div>
      <div class="kv"><span>Held by</span><span>${esc(cap(u.held_by))}</span></div>
      <div class="kv"><span>${esc(u.po_id)}</span><span>${esc(u.po_age_days)} of ${esc(u.po_expires_after_days)} days old, ${u.vehicle_matched ? "truck matched" : "no truck matched"}</span></div>
    </div>
  </div>`;
}
function viewMisses() {
  const misses = S.misses || [];
  const rows = misses.map((m) => {
    const unknown = m.stage === "not established";
    return `<tr data-key="m-${esc(m.route)}-${esc(m.product)}">
      <td>Route ${esc(m.route)}</td><td>${esc(productName(m.product))}</td>
      <td>${unknown ? chip("Not established", "or") : esc(cap(m.stage))}</td><td>${esc(cap(m.held_by))}</td>
      <td class="r">${(m.evidence || []).filter(isEv).map(evBtn).join(" ")}</td>
    </tr>`;
  }).join("");
  return `<div data-key="v-misses">
    <h1>Misses</h1>
    <p class="sub">Low yesterday and low today: where it is stuck and who holds it</p>
    ${butterChart()}
    ${upstreamPanel()}
    <div class="mtable">
    ${misses.length ? `<table class="otable"><thead><tr><th>Route</th><th>Product</th><th>Stuck at</th><th>Held by</th><th class="r">Evidence</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="muted">No misses logged yet</p>`}
    </div>
  </div>`;
}

/* ---------- Timeline ---------- */
const TOOL_WORDS = {
  find_records: (a) => `Looked up "${a.text}"`,
  truck_board: () => "Read the truck board",
  billing_gap: (a) => `Checked billing history of ${a.product}`,
  trace_upstream: (a) => `Traced ${a.product} upstream`,
  match_vehicle: (a) => `Looked for a vehicle for ${a.product}`,
  retailer_stock: (a) => `Estimated ${a.retailer}'s stock of ${a.product}`,
  price_options: (a) => `Priced the options for ${a.truck}`,
  plan_offers: (a) => `Chose who to ask for ${a.truck}`,
  add_request: (a) => `Added ${a.retailer}'s request to the plan`,
  send_offer: (a) => `Prepared an offer for ${a.retailer}`,
  accept_offer: (a) => `Recording ${a.retailer}'s yes`,
  send_message: (a) => `Prepared a message for ${a.recipient}`,
  request_decision: () => "Prepared a question for a person",
  finalize_truck: (a) => `Locking ${a.truck}`,
  write_orders: (a) => `Writing orders for ${a.truck}`,
  issue_load_sheet: (a) => `Issuing the load sheet for ${a.truck}`,
  record_drop: (a) => `Closing the drop at ${a.retailer}`,
  log_miss: (a) => `Logging a miss on route ${a.route}`,
  report_to_lead: () => "Prepared a report",
};
function describe(e) {
  switch (e.kind) {
    case "request": return { t: "Dispatch lead asked", d: e.text };
    case "tool_call": { const f = TOOL_WORDS[e.name]; return { t: f ? f(e.args || {}) : `Used ${e.name}`, tone: "dim" }; }
    case "message_sent": return { t: `Message to ${e.recipient}`, d: e.text, sim: e.channel === "simulated" };
    case "reply": return { t: `Reply from ${e.sender}`, d: e.text, sim: !!e.simulated };
    case "duplicate_reply_ignored": return { t: `Same reply from ${e.sender} again. Counted once`, d: e.text, tone: "warn", sim: !!e.simulated };
    case "load_changed": return { t: `${e.truck} now at ${fillPct(e.fill)}`, d: `${e.retailer}: ${group(e.pieces)} of ${productName(e.product)}, ${group(e.kg)} kg on truck` };
    case "order_error": return { t: `Order system failed: ${e.error}`, d: `Try ${group(e.attempt)}. Reading back before any retry.`, tone: "warn" };
    case "order_read_back_found": return { t: "Read back found the order saved", d: `${e.note || "No duplicate created."} ${e.key || ""}`, tone: "moment" };
    case "order_already_saved": return { t: "Order already saved. Not written again", d: e.key, tone: "dim" };
    case "order_conflict": return { t: `Order refused: ${e.error}`, d: e.key, tone: "warn" };
    case "orders_written": return { t: `Orders written for ${e.truck}`, d: Object.entries(e.counts || {}).map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`).join(", ") };
    case "gate_blocked": return { t: "Source check blocked a message", d: `${e.reason}${e.text ? `\n"${e.text}"` : ""}`, tone: "moment" };
    case "decision_requested": return { t: "Asked a person to decide", d: e.question };
    case "decision_answered": return { t: `${e.by || "A person"} answered: ${e.answer}` };
    case "truck_decided": return { t: `${e.truck} locked: ${optionName(e.option)} at ${fillPct(e.fill)}`, d: e.reason };
    case "load_sheet_issued": return { t: `Load sheet issued for ${e.truck}`, d: `${plural(num(e.stops), "stop")}, ${plural(num(e.lines), "line")}, ${group(e.partial)} partial` };
    case "drop_recorded": return { t: `${e.retailer} ${e.status}`, d: e.photo ? "Driver sent a photo" : "No photo" };
    case "miss_logged": return { t: `Miss logged on route ${e.route}`, d: `${productName(e.product)}. ${cap(e.stage)}. Held by ${e.held_by}` };
    case "report": return { t: "Report to dispatch lead", d: e.text };
    case "resumed_after_restart": return { t: "Picked up where it left off after a restart", tone: "warn" };
    case "agent_error": return { t: "Agent hit an error", d: e.error, tone: "warn" };
    case "tool_error": return { t: `${e.name} failed`, d: e.error, tone: "warn" };
    case "fault_set": return { t: e.fault ? `Fault set: ${e.fault}` : "Fault cleared", tone: "dim" };
    case "send_skipped_duplicate": return { t: `Already sent to ${e.recipient}. Not sent again`, tone: "dim" };
    case "agent_note": return { t: "Trex noted", d: e.text, tone: "dim" };
    case "refusal": return { t: "The model refused this step", d: e.details, tone: "warn" };
    case "step_limit": return { t: "Stopped at the step limit. Needs a person", tone: "warn" };
    case "llm_retry": return { t: `Retrying the model call: ${e.reason}`, tone: "dim" };
    default: return { t: String(e.kind).replace(/_/g, " "), tone: "dim" };
  }
}
function timelineItem(e) {
  const x = describe(e);
  const rest = Object.assign({}, e);
  delete rest.kind; delete rest.seq; delete rest.ts;
  const ids = findEv(rest);
  return `<div class="tl-item ${x.tone || ""}" data-key="e-${esc(e.seq)}">
    <time class="num">${esc(clock(e.ts))}</time>
    <div>
      <div class="tl-t">${esc(x.t)}</div>
      ${x.d ? `<div class="tl-d">${linkEv(x.d)}</div>` : ""}
      ${x.sim ? `<div style="margin-top:3px"><span class="sim">Simulated</span></div>` : ""}
      ${ids.length ? `<div class="tl-ev">${ids.slice(0, 8).map(evBtn).join("")}</div>` : ""}
    </div>
  </div>`;
}
function timelineEvents() {
  const list = ((S && S.timeline) || []).slice();
  const seen = new Set(list.map((e) => e.seq));
  ((S && S.order_events) || []).forEach((e) => {
    if ((e.kind === "order_read_back_found" || e.kind === "order_error") && !seen.has(e.seq)) list.push(e);
  });
  return list.sort((a, b) => num(a.seq) - num(b.seq));
}
function renderTimeline() {
  const list = timelineEvents();
  const safety = (S && S.safety) || null;
  const bits = [];
  if (safety) {
    if (num(safety.source_check_blocks)) bits.push(plural(num(safety.source_check_blocks), "source check block"));
    if (num(safety.duplicate_replies_ignored)) bits.push(plural(num(safety.duplicate_replies_ignored), "duplicate reply", "duplicate replies") + " ignored");
    if (num(safety.sends_skipped)) bits.push(plural(num(safety.sends_skipped), "repeat send") + " skipped");
    if (num(safety.resumes)) bits.push(plural(num(safety.resumes), "restart"));
  }
  patch($("#drawer-head"), `<div class="top"><h2 style="font-size:17px">Timeline</h2><button class="btn" data-act="timeline">Close</button></div>
    ${bits.length ? `<div class="safety">${bits.map((b) => `<span>${esc(b)}</span>`).join("")}</div>` : ""}`);
  patch($("#tl"), list.length ? list.slice().reverse().map(timelineItem).join("") : `<p class="quiet">Nothing has happened yet</p>`);
  const moments = list.filter((e) => e.kind === "gate_blocked" || e.kind === "order_read_back_found").length;
  patch($("#tl-btn"), `<span>Timeline</span>${moments ? `<span class="count">${moments}</span>` : list.length ? `<span class="count plain">${list.length}</span>` : ""}`);
}

/* ---------- Toasts for the moments worth watching ---------- */
const TOAST_KINDS = {
  gate_blocked: (e) => ({ title: "Source check blocked a message", body: e.reason }),
  order_read_back_found: () => ({ title: "Read back found the order saved", body: "The system reported an error, but the order was there. No duplicate." }),
  decision_requested: (e) => (["trucks", "truck", "sell", "offers"].includes(view.name) ? null : { title: "Trex needs you", body: e.question, plain: true, go: "#/trucks" }),
  report: (e) => ({ title: "New report from Trex", body: String(e.text || "").slice(0, 140), plain: true, go: "#/trucks" }),
  agent_error: (e) => ({ title: "Agent hit an error", body: String(e.error || "").slice(0, 140) }),
};
function toast(o) {
  const el = document.createElement("button");
  el.className = "toast" + (o.plain ? " plain" : "");
  el.innerHTML = `<b>${esc(o.title)}</b>${esc(o.body || "")}`;
  if (o.go) el.dataset.go = o.go; else el.dataset.act = "timeline-open";
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), o.ms || 9000);
}
function checkToasts() {
  const list = timelineEvents();
  const top = list.reduce((m, e) => Math.max(m, num(e.seq)), 0);
  if (seenSeq === null) { seenSeq = top; return; }
  list.forEach((e) => {
    if (num(e.seq) <= seenSeq || !TOAST_KINDS[e.kind]) return;
    const t = TOAST_KINDS[e.kind](e);
    if (t) toast(t);
  });
  seenSeq = Math.max(seenSeq, top);
}

/* ---------- Evidence ---------- */
const evInFlight = new Set();
function requestEvidence(id) {
  if (evCache.has(id) || evInFlight.has(id)) return;
  evInFlight.add(id);
  fetch(`/api/evidence/${encodeURIComponent(id)}`, { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((e) => { if (e) { evCache.set(id, e); render(); } })
    .catch(() => {})
    .finally(() => evInFlight.delete(id));
}
function paintEvidence(id, e, error) {
  const panel = $("#evpanel");
  const close = `<button class="btn" data-act="ev-close" id="ev-close">Close</button>`;
  if (error) {
    panel.innerHTML = `<div class="top"><span class="mono muted">${esc(id)}</span>${close}</div><p class="muted">${esc(error)}</p>`;
    return;
  }
  if (!e) {
    panel.innerHTML = `<div class="top"><span class="mono muted">${esc(id)}</span>${close}</div><p class="muted">Loading</p>`;
    return;
  }
  panel.innerHTML = `<div class="top">
      <span class="chips">${Number(e.standin) === 1 ? chip("Stand-in", "am") : ""}${e.kind !== "standin" ? chip(e.kind, "mu") : ""}</span>${close}
    </div>
    <h2>${esc(e.summary)}</h2>
    <div class="mono muted">${esc(e.id)}${e.ref ? ` · ${esc(e.ref)}` : ""}</div>
    <pre>${esc(JSON.stringify(e.data, null, 2))}</pre>`;
}
async function showEvidence(id, opener) {
  openEvidence = { id, opener };
  $("#scrim").hidden = false;
  paintEvidence(id, evCache.get(id));
  const closeBtn = $("#ev-close");
  if (closeBtn) closeBtn.focus();
  try {
    const r = await fetch(`/api/evidence/${encodeURIComponent(id)}`, { cache: "no-store" });
    if (!openEvidence || openEvidence.id !== id) return;
    if (!r.ok) { paintEvidence(id, null, "No such evidence"); return; }
    const e = await r.json();
    evCache.set(id, e);
    paintEvidence(id, e);
  } catch (err) {
    if (openEvidence && openEvidence.id === id) paintEvidence(id, null, "Could not reach the server");
  }
  const again = $("#ev-close");
  if (again) again.focus();
}
function closeEvidence() {
  const opener = openEvidence && openEvidence.opener;
  openEvidence = null;
  $("#scrim").hidden = true;
  if (opener && document.contains(opener)) opener.focus();
}

/* ---------- Rendering ---------- */
const VIEWS = { trucks: viewTrucks, truck: viewTruck, sell: viewSell, offers: viewSell, retailers: viewRetailers, batches: viewBatches, misses: viewMisses };
function renderChrome() {
  const family = { truck: "trucks", sell: "trucks", offers: "trucks" }[view.name] || view.name;
  const pending = pendingDecisions().length;
  const items = [["trucks", "Trucks", pending], ["retailers", "Retailers"], ["batches", "Batches"], ["misses", "Misses"]];
  patch($("#nav"), items.map(([id, label, n]) => `<a href="#/${id}" class="${family === id ? "on" : ""}" ${family === id ? 'aria-current="page"' : ""}><span>${label}</span>${n ? `<span class="count">${n}</span>` : ""}</a>`).join(""));
  const labels = { working: "Working", waiting: "Waiting", needs_person: "Needs a person", error: "Error", closed: "Closed" };
  let line;
  if (!online) line = `<span class="dot bad"></span>Reconnecting`;
  else if (S && S.run) {
    const st = S.run.status;
    const dot = st === "working" ? "work" : st === "error" || st === "needs_person" ? "bad" : "";
    const cost = S.cost ? ` · $${num(S.cost.usd).toFixed(3)}` : "";
    line = `<span class="dot ${dot}"></span>${esc(labels[st] || st)}<span title="Claude API cost of this run">${esc(cost)}</span>`;
  } else line = `<span class="dot"></span>No run yet`;
  patch($("#status"), line);
}
function render() {
  if (!S) return;
  if (view.name === "sell" && !isSelling() && !gauge.raf) {
    location.replace(S.run && S.offers && S.offers.length ? `#/truck/${encodeURIComponent(S.focus)}` : "#/trucks");
    return;
  }
  const main = $("#main");
  const chat = $("#chat");
  const stick = !chat || chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
  patch(main, VIEWS[view.name]());
  const after = $("#chat");
  if (after && (stick || after !== chat)) after.scrollTop = after.scrollHeight;
  renderChrome();
  renderTimeline();
}
function onState() {
  const id = S.run ? S.run.id : null;
  if (id !== runId) {
    runId = id;
    seenSeq = null;
    evCache.clear();
    gauge.start = null; gauge.shown = null; gauge.crossed = false; gauge.to = 0;
    if (gauge.raf) { cancelAnimationFrame(gauge.raf); gauge.raf = 0; }
    busyDecisions.clear();
  }
  checkToasts();
  if (isSelling() && autoShown !== id) {
    autoShown = id;
    if (view.name === "trucks" || view.name === "truck") location.hash = "#/sell";
  }
  syncGauge();
  render();
}

/* ---------- Polling ---------- */
let pollTimer = 0, polling = false, pollAgain = false;
async function poll() {
  clearTimeout(pollTimer);
  if (polling) { pollAgain = true; return; }
  polling = true;
  const began = performance.now();
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    S = await r.json();
    online = true;
    onState();
  } catch (e) {
    online = false;
    renderChrome();
  }
  polling = false;
  if (pollAgain) { pollAgain = false; poll(); return; }
  pollTimer = setTimeout(poll, Math.max(0, 1000 - (performance.now() - began)));
}

/* ---------- Routing ---------- */
function parseHash() {
  let parts = [];
  try { parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent); } catch (e) { parts = []; }
  switch (parts[0]) {
    case "truck": return parts[1] ? { name: "truck", truck: parts[1] } : { name: "trucks" };
    case "sell": return { name: "sell" };
    case "offers": return { name: "offers" };
    case "retailers": return { name: "retailers", id: parts[1] ? normalizeRetailer(parts[1]) : "" };
    case "batches": return { name: "batches" };
    case "misses": return { name: "misses" };
    default: return { name: "trucks" };
  }
}
function onRoute() {
  const before = view;
  view = parseHash();
  if (before.name !== view.name || before.truck !== view.truck) $("#main").scrollTop = 0;
  if (view.name === "retailers") {
    if (view.id && view.id !== retailer.id) loadRetailer(view.id);
    if (!view.id) retailer = { id: "", data: null, error: null, loading: false };
  }
  syncGauge();
  render();
  if (view.name === "retailers") {
    const input = $("#ret-input");
    if (input && document.activeElement !== input) input.value = view.id || "";
  }
}
window.addEventListener("hashchange", onRoute);

/* ---------- Actions ---------- */
function demoNote(text) { $("#demo-note").textContent = text; }
async function demoAction(run) {
  try { demoNote(await run()); poll(); }
  catch (e) { demoNote(e.message); }
}
const needsRun = () => { if (!S || !S.run) throw new Error("Start a run first"); };
const ACTIONS = {
  timeline() { $("#drawer").classList.toggle("open"); },
  "timeline-open"() { $("#drawer").classList.add("open"); },
  demo() { const d = $("#demo"); d.hidden = !d.hidden; },
  theme() {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("trex-theme", next); } catch (e) {}
  },
  "ev-close"() { closeEvidence(); },
  async answer(el) {
    const id = el.dataset.id;
    if (!S || !S.run) return;
    busyDecisions.add(id);
    render();
    try {
      await post(`/api/decision/${encodeURIComponent(id)}?run=${encodeURIComponent(S.run.id)}`, { answer: el.dataset.answer });
    } catch (e) {
      busyDecisions.delete(id);
      toast({ title: "Answer not saved", body: e.message, plain: true });
    }
    poll();
  },
  fault() {
    const fault = $("#fault-sel").value;
    demoAction(async () => { needsRun(); await post("/api/fault", { fault, times: 1 }); return `Next write fails: ${fault}`; });
  },
  live() {
    const id = normalizeRetailer($("#live-input").value);
    demoAction(async () => {
      needsRun();
      await post("/api/live", { retailer: id || null });
      return id ? `Live phone answers for ${id}` : "Live phone cleared";
    });
  },
  tomorrow() {
    demoAction(async () => {
      needsRun();
      const r = await post("/api/tomorrow");
      const live = (r.waiting_on_live || []).length;
      return `${plural(num(r.simulated_drops), "simulated drop")} sent${live ? `, ${live} waiting on the live phone` : ""}`;
    });
  },
  reset() {
    if (!window.confirm("Clear every run and start clean?")) return;
    demoAction(async () => {
      await post("/api/reset");
      retailer = { id: "", data: null, error: null, loading: false };
      autoShown = null;
      location.hash = "#/trucks";
      return "Reset done";
    });
  },
};
document.addEventListener("click", (ev) => {
  const go = ev.target.closest("[data-go]");
  if (go) { location.hash = go.dataset.go; go.remove(); return; }
  const evEl = ev.target.closest("[data-ev]");
  if (evEl) { ev.preventDefault(); ev.stopPropagation(); showEvidence(evEl.dataset.ev, evEl); return; }
  const act = ev.target.closest("[data-act]");
  if (act && ACTIONS[act.dataset.act]) {
    ACTIONS[act.dataset.act](act);
    if (act.classList.contains("toast")) act.remove();
    return;
  }
  if (ev.target === $("#scrim")) { closeEvidence(); return; }
  const demo = $("#demo");
  if (!demo.hidden && !demo.contains(ev.target)) demo.hidden = true;
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  if (openEvidence) closeEvidence();
  else if (!$("#demo").hidden) $("#demo").hidden = true;
  else $("#drawer").classList.remove("open");
});
document.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (ev.target.id === "ret-form") {
    const id = normalizeRetailer($("#ret-input").value);
    if (!id) return;
    if (id === retailer.id && parseHash().id === id) loadRetailer(id);
    else location.hash = `#/retailers/${encodeURIComponent(id)}`;
    return;
  }
  if (ev.target.id === "req-form") {
    const input = $("#req-input");
    const text = input.value.trim();
    if (!text || requestBusy) return;
    requestBusy = true;
    render();
    try {
      await post("/api/request", { text });
      input.value = "";
    } catch (e) {
      toast({ title: "Request not sent", body: e.message, plain: true });
    }
    requestBusy = false;
    poll();
  }
});

view = parseHash();
if (view.name === "retailers" && view.id) loadRetailer(view.id);
poll();
</script>
</body>
</html>
